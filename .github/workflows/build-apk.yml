name: build-apk

on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
      app_name:
        required: true
      package_id:
        required: true
      source_url:
        required: false
        default: ""
      source_html:
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Prepare web content
        env:
          SOURCE_HTML: ${{ inputs.source_html }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          mkdir -p web
          if [ -n "$SOURCE_HTML" ]; then
            printf '%s' "$SOURCE_HTML" > web/index.html
          else
            echo "<html><body><script>location.href='$SOURCE_URL'</script></body></html>" > web/index.html
          fi

      - name: Generate Android project
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_ID: ${{ inputs.package_id }}
        run: |
          python3 scripts/generate_project.py "$APP_NAME" "$PACKAGE_ID" web android-project

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build APK
        run: |
          cd android-project
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.build_id }}
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
