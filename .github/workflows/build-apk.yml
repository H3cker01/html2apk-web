name: build-apk

on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
      app_name:
        required: true
      package_id:
        required: true
      source_url:
        required: false
        default: ""
      source_html:
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          sudo apt-get install -y wget unzip
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          mkdir -p $HOME/android/cmdline-tools
          unzip -q cmdtools.zip -d $HOME/android/cmdline-tools
          mv $HOME/android/cmdline-tools/cmdline-tools $HOME/android/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android" >> $GITHUB_ENV
          echo "$HOME/android/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android/platform-tools" >> $GITHUB_PATH
          yes | $HOME/android/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android "platforms;android-34" "build-tools;34.0.0" 2>/dev/null

      - name: Prepare web content
        env:
          SOURCE_HTML: ${{ inputs.source_html }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          mkdir -p web
          if [ -n "$SOURCE_HTML" ]; then
            printf '%s' "$SOURCE_HTML" > web/index.html
          else
            echo "<html><body><script>location.href='$SOURCE_URL'</script></body></html>" > web/index.html
          fi

      - name: Generate Android project
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_ID: ${{ inputs.package_id }}
        run: |
          set -x
          ls -la
          ls -la web/ || echo "web dir missing"
          python3 -v scripts/generate_project.py "$APP_NAME" "$PACKAGE_ID" web android-project 2>&1
          echo "Exit: $?"
          ls -la android-project/ || echo "android-project not created"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build APK
        run: |
          cd android-project
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.build_id }}
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
